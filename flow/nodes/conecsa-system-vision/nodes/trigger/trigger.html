<script type="text/javascript">
  RED.nodes.registerType("conecsa-camera-trigger", {
    category: "Conecsa",
    color: "#1a73e8",
    defaults: {
      name: { value: "" },
      hub: { value: "", type: "conecsa-hub", required: false },
      device: { value: "" },
      inferenceUrl: { value: "" },
      action: {
        value: "toggle",
        validate: RED.validators.regex(/^(enable|disable|toggle|payload)$/),
      },
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-bolt",
    label: function () {
      return this.name || "camera-trigger";
    },
    oneditprepare: function () {
      this._conecsaHub = window.conecsaHubFields ? window.conecsaHubFields(this) : null;
    },
    oneditsave: function () {
      if (this._conecsaHub) this._conecsaHub.save();
    },
    paletteLabel: "camera-trigger",
  });
</script>

<script type="text/html" data-template-name="conecsa-camera-trigger">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-hub"><i class="fa fa-sitemap"></i> Hub</label>
    <input type="text" id="node-input-hub" />
  </div>
  <div class="form-row" id="conecsa-device-row">
    <label for="node-input-device"><i class="fa fa-id-card"></i> Device</label>
    <select id="node-input-device" style="width:70%"></select>
    <span id="conecsa-device-hint" style="display:block; margin-left:105px; color:#888; font-size:0.9em"></span>
  </div>
  <div class="form-row">
    <label for="node-input-inferenceUrl"><i class="fa fa-server"></i> API endpoint</label>
    <input type="text" id="node-input-inferenceUrl" placeholder="http://api-gateway:5000" />
  </div>
  <div class="form-row">
    <label for="node-input-action"><i class="fa fa-cog"></i> Action</label>
    <select id="node-input-action">
      <option value="toggle">Toggle (auto)</option>
      <option value="enable">Enable</option>
      <option value="disable">Disable</option>
      <option value="payload">Payload</option>
    </select>
  </div>
</script>

<script type="text/html" data-help-name="conecsa-camera-trigger">
  <p>
    Controls the inference trigger. When the trigger is
    <b>disabled</b>, the processed video stream is frozen at the last frame;
    when <b>enabled</b>, frames are processed normally.
  </p>
  <h3>Connection</h3>
  <p>
    Select a <b>Hub</b> (a <code>conecsa-hub</code> configuration) and a
    <b>Device</b> to reach the device through the hub's Developer API; the
    <b>API endpoint</b> then shows the resulting route
    (<code>https://&lt;hub&gt;:&lt;port&gt;/devices/&lt;device&gt;</code>).
    Leave the hub empty to call an api-gateway directly: the API endpoint field,
    then the <code>INFERENCE_URL</code> environment variable, then
    <code>http://api-gateway:5000</code> (the default inside a device).
  </p>
  <h3>Input</h3>
  <dl class="message-properties">
    <dt class="optional">action <span class="property-type">string</span></dt>
    <dd>
      Override the configured action: <code>enable</code>,
      <code>disable</code>, or <code>toggle</code>.
    </dd>
    <dt class="optional">payload <span class="property-type">boolean</span></dt>
    <dd>
      When action is <code>payload</code>, the node uses <code>msg.payload</code>
      directly: <code>true</code> enables, <code>false</code> disables.
    </dd>
  </dl>
  <h3>Output</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>
      Response from the inference service, e.g.
      <code>{ trigger_enabled: true }</code>.
    </dd>
  </dl>
</script>
