<script type="text/javascript">
  RED.nodes.registerType("conecsa-start-stop", {
    category: "Conecsa",
    color: "#1a73e8",
    defaults: {
      name: { value: "" },
      hub: { value: "", type: "conecsa-hub", required: false },
      device: { value: "" },
      inferenceUrl: { value: "" },
      action: {
        value: "toggle",
        validate: RED.validators.regex(/^(start|stop|toggle|payload)$/),
      },
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-power-off",
    label: function () {
      return this.name || "start/stop";
    },
    oneditprepare: function () {
      this._conecsaHub = window.conecsaHubFields ? window.conecsaHubFields(this) : null;
    },
    oneditsave: function () {
      if (this._conecsaHub) this._conecsaHub.save();
    },
    paletteLabel: "start/stop",
  });
</script>

<script type="text/html" data-template-name="conecsa-start-stop">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-hub"><i class="fa fa-sitemap"></i> Hub</label>
    <input type="text" id="node-input-hub" />
  </div>
  <div class="form-row" id="conecsa-device-row">
    <label for="node-input-device"><i class="fa fa-id-card"></i> Device</label>
    <select id="node-input-device" style="width:70%"></select>
    <span id="conecsa-device-hint" style="display:block; margin-left:105px; color:#888; font-size:0.9em"></span>
  </div>
  <div class="form-row">
    <label for="node-input-inferenceUrl"><i class="fa fa-server"></i> API endpoint</label>
    <input type="text" id="node-input-inferenceUrl" placeholder="http://api-gateway:5000" />
  </div>
  <div class="form-row">
    <label for="node-input-action"><i class="fa fa-cog"></i> Action</label>
    <select id="node-input-action">
      <option value="toggle">Toggle (auto)</option>
      <option value="start">Start</option>
      <option value="stop">Stop</option>
      <option value="payload">Payload</option>
    </select>
  </div>
</script>

<script type="text/html" data-help-name="conecsa-start-stop">
  <p>
    Starts or stops object detection on the inference service.
  </p>
  <h3>Connection</h3>
  <p>
    Select a <b>Hub</b> (a <code>conecsa-hub</code> configuration) and a
    <b>Device</b> to reach the device through the hub's Developer API; the
    <b>API endpoint</b> then shows the resulting route
    (<code>https://&lt;hub&gt;:&lt;port&gt;/devices/&lt;device&gt;</code>).
    Leave the hub empty to call an api-gateway directly: the API endpoint field,
    then the <code>INFERENCE_URL</code> environment variable, then
    <code>http://api-gateway:5000</code> (the default inside a device).
  </p>
  <h3>Configuration</h3>
  <dl class="message-properties">
    <dt>action <span class="property-type">string</span></dt>
    <dd>
      <code>start</code> — start detection.<br />
      <code>stop</code> — stop detection.<br />
      <code>toggle</code> — auto-toggle based on current state.<br />
      <code>payload</code> — use <code>msg.payload</code> (<code>true</code>=start, <code>false</code>=stop).
    </dd>
  </dl>
  <h3>Input</h3>
  <dl class="message-properties">
    <dt class="optional">action <span class="property-type">string</span></dt>
    <dd>Override the configured action.</dd>
    <dt class="optional">payload <span class="property-type">boolean</span></dt>
    <dd>For <code>payload</code> mode: <code>true</code> starts, <code>false</code> stops.</dd>
  </dl>
  <h3>Output</h3>
  <p>
    Emits <code>{ payload: { is_running: boolean } }</code> every time
    the detection state changes on the inference service, no matter
    which client triggered the change (this node, the web UI, another
    flow, curl). The initial state at flow start is NOT emitted — only
    real transitions. Input-driven start/stop calls do not emit on
    their own; they only emit indirectly via the state stream when the
    POST actually flips <code>is_running</code> (a no-op POST produces
    no message).
  </p>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd><code>{ is_running: true|false }</code></dd>
  </dl>
</script>
