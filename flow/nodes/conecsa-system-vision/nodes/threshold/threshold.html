<script type="text/javascript">
  RED.nodes.registerType("conecsa-threshold", {
    category: "Conecsa",
    color: "#1a73e8",
    defaults: {
      name: { value: "" },
      hub: { value: "", type: "conecsa-hub", required: false },
      device: { value: "" },
      inferenceUrl: { value: "" },
      thresholdType: { value: "confidence" },
      value: { value: "0.5", validate: RED.validators.number() },
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-sliders",
    label: function () {
      return this.name || "threshold";
    },
    oneditprepare: function () {
      this._conecsaHub = window.conecsaHubFields ? window.conecsaHubFields(this) : null;
    },
    oneditsave: function () {
      if (this._conecsaHub) this._conecsaHub.save();
    },
    paletteLabel: "threshold",
  });
</script>

<script type="text/html" data-template-name="conecsa-threshold">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-hub"><i class="fa fa-sitemap"></i> Hub</label>
    <input type="text" id="node-input-hub" />
  </div>
  <div class="form-row" id="conecsa-device-row">
    <label for="node-input-device"><i class="fa fa-id-card"></i> Device</label>
    <select id="node-input-device" style="width:70%"></select>
    <span id="conecsa-device-hint" style="display:block; margin-left:105px; color:#888; font-size:0.9em"></span>
  </div>
  <div class="form-row">
    <label for="node-input-inferenceUrl"><i class="fa fa-server"></i> API endpoint</label>
    <input type="text" id="node-input-inferenceUrl" placeholder="http://api-gateway:5000" />
  </div>
  <div class="form-row">
    <label for="node-input-thresholdType"><i class="fa fa-cog"></i> Type</label>
    <select id="node-input-thresholdType">
      <option value="confidence">Confidence</option>
      <option value="overlay">Overlay</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-value"><i class="fa fa-percent"></i> Value (0-1)</label>
    <input type="text" id="node-input-value" placeholder="0.5" />
  </div>
</script>

<script type="text/html" data-help-name="conecsa-threshold">
  <p>
    Sets the confidence or overlay threshold on the inference service.
  </p>
  <h3>Connection</h3>
  <p>
    Select a <b>Hub</b> (a <code>conecsa-hub</code> configuration) and a
    <b>Device</b> to reach the device through the hub's Developer API; the
    <b>API endpoint</b> then shows the resulting route
    (<code>https://&lt;hub&gt;:&lt;port&gt;/devices/&lt;device&gt;</code>).
    Leave the hub empty to call an api-gateway directly: the API endpoint field,
    then the <code>INFERENCE_URL</code> environment variable, then
    <code>http://api-gateway:5000</code> (the default inside a device).
  </p>
  <h3>Configuration</h3>
  <dl class="message-properties">
    <dt>thresholdType <span class="property-type">string</span></dt>
    <dd><code>confidence</code> or <code>overlay</code>.</dd>
    <dt>value <span class="property-type">number</span></dt>
    <dd>Threshold value between 0.0 and 1.0.</dd>
  </dl>
  <h3>Input</h3>
  <dl class="message-properties">
    <dt class="optional">payload <span class="property-type">number</span></dt>
    <dd>Overrides the configured value.</dd>
    <dt class="optional">thresholdType <span class="property-type">string</span></dt>
    <dd>Overrides the configured type.</dd>
  </dl>
  <h3>Output</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>
      Response from the inference service, e.g.
      <code>{ success: true, threshold: 0.5 }</code>.
    </dd>
  </dl>
</script>
