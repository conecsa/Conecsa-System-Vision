<script type="text/javascript">
  RED.nodes.registerType("conecsa-system-status", {
    category: "Conecsa",
    color: "#1a73e8",
    defaults: {
      name: { value: "" },
      hub: { value: "", type: "conecsa-hub", required: false },
      device: { value: "" },
      inferenceUrl: { value: "" },
      mode: { value: "on-demand" },
      interval: { value: "10", validate: RED.validators.number() },
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-heartbeat",
    label: function () {
      return this.name || "system status";
    },
    paletteLabel: "system status",
    oneditprepare: function () {
      this._conecsaHub = window.conecsaHubFields ? window.conecsaHubFields(this) : null;
      function toggleInterval() {
        var mode = $("#node-input-mode").val();
        if (mode === "interval") {
          $("#row-interval").show();
        } else {
          $("#row-interval").hide();
        }
      }
      $("#node-input-mode").on("change", toggleInterval);
      toggleInterval();
    },
    oneditsave: function () {
      if (this._conecsaHub) this._conecsaHub.save();
    },
  });
</script>

<script type="text/html" data-template-name="conecsa-system-status">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-hub"><i class="fa fa-sitemap"></i> Hub</label>
    <input type="text" id="node-input-hub" />
  </div>
  <div class="form-row" id="conecsa-device-row">
    <label for="node-input-device"><i class="fa fa-id-card"></i> Device</label>
    <select id="node-input-device" style="width:70%"></select>
    <span id="conecsa-device-hint" style="display:block; margin-left:105px; color:#888; font-size:0.9em"></span>
  </div>
  <div class="form-row">
    <label for="node-input-inferenceUrl"><i class="fa fa-server"></i> API endpoint</label>
    <input type="text" id="node-input-inferenceUrl" placeholder="http://api-gateway:5000" />
  </div>
  <div class="form-row">
    <label for="node-input-mode"><i class="fa fa-cog"></i> Mode</label>
    <select id="node-input-mode">
      <option value="on-demand">On demand (requires input)</option>
      <option value="interval">Interval (automatic polling)</option>
    </select>
  </div>
  <div class="form-row" id="row-interval">
    <label for="node-input-interval"><i class="fa fa-clock-o"></i> Interval (s)</label>
    <input type="text" id="node-input-interval" placeholder="10" />
  </div>
</script>

<script type="text/html" data-help-name="conecsa-system-status">
  <p>
    Retrieves system metrics from the inference service (CPU, RAM, disk,
    temperature, GPU).
  </p>
  <h3>Connection</h3>
  <p>
    Select a <b>Hub</b> (a <code>conecsa-hub</code> configuration) and a
    <b>Device</b> to reach the device through the hub's Developer API; the
    <b>API endpoint</b> then shows the resulting route
    (<code>https://&lt;hub&gt;:&lt;port&gt;/devices/&lt;device&gt;</code>).
    Leave the hub empty to call an api-gateway directly: the API endpoint field,
    then the <code>INFERENCE_URL</code> environment variable, then
    <code>http://api-gateway:5000</code> (the default inside a device).
  </p>
  <h3>Configuration</h3>
  <dl class="message-properties">
    <dt>mode <span class="property-type">string</span></dt>
    <dd>
      <code>on-demand</code> — send any message to trigger a fetch.<br />
      <code>interval</code> — polls automatically at the configured interval.
    </dd>
    <dt>interval <span class="property-type">number</span></dt>
    <dd>Polling interval in seconds (only for <code>interval</code> mode).</dd>
  </dl>
  <h3>Output</h3>
  <dl class="message-properties">
    <dt>payload.cpu_usage <span class="property-type">number</span></dt>
    <dd>CPU usage percentage.</dd>
    <dt>payload.ram_usage <span class="property-type">number</span></dt>
    <dd>RAM usage percentage.</dd>
    <dt>payload.ram_total <span class="property-type">number</span></dt>
    <dd>Total RAM in bytes.</dd>
    <dt>payload.ram_used <span class="property-type">number</span></dt>
    <dd>Used RAM in bytes.</dd>
    <dt>payload.disk_usage <span class="property-type">number</span></dt>
    <dd>Disk usage percentage.</dd>
    <dt>payload.temperature <span class="property-type">number</span></dt>
    <dd>CPU temperature (if available).</dd>
    <dt>payload.gpu_usage <span class="property-type">number</span></dt>
    <dd>GPU usage percentage (if available).</dd>
    <dt>payload.gpu_temperature <span class="property-type">number</span></dt>
    <dd>GPU temperature (if available).</dd>
  </dl>
</script>
