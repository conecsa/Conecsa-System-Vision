<script type="text/javascript">
  RED.nodes.registerType("conecsa-stats", {
    category: "Conecsa",
    color: "#1a73e8",
    defaults: {
      name: { value: "" },
      hub: { value: "", type: "conecsa-hub", required: false },
      device: { value: "" },
      inferenceUrl: { value: "" },
      mode: { value: "on-change" },
      interval: { value: "2", validate: RED.validators.number() },
    },
    inputs: 0,
    outputs: 1,
    icon: "font-awesome/fa-tachometer",
    label: function () {
      return this.name || "stats";
    },
    paletteLabel: "stats",
    oneditprepare: function () {
      this._conecsaHub = window.conecsaHubFields ? window.conecsaHubFields(this) : null;
      var node = this;
      function toggleInterval() {
        var mode = $("#node-input-mode").val();
        if (mode === "on-change") {
          $("#row-interval").hide();
        } else {
          $("#row-interval").show();
        }
      }
      $("#node-input-mode").on("change", toggleInterval);
      toggleInterval();
    },
    oneditsave: function () {
      if (this._conecsaHub) this._conecsaHub.save();
    },
  });
</script>

<script type="text/html" data-template-name="conecsa-stats">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-hub"><i class="fa fa-sitemap"></i> Hub</label>
    <input type="text" id="node-input-hub" />
  </div>
  <div class="form-row" id="conecsa-device-row">
    <label for="node-input-device"><i class="fa fa-id-card"></i> Device</label>
    <select id="node-input-device" style="width:70%"></select>
    <span id="conecsa-device-hint" style="display:block; margin-left:105px; color:#888; font-size:0.9em"></span>
  </div>
  <div class="form-row">
    <label for="node-input-inferenceUrl"><i class="fa fa-server"></i> API endpoint</label>
    <input type="text" id="node-input-inferenceUrl" placeholder="http://api-gateway:5000" />
  </div>
  <div class="form-row">
    <label for="node-input-mode"><i class="fa fa-cog"></i> Mode</label>
    <select id="node-input-mode">
      <option value="interval">Interval (throttled push)</option>
      <option value="on-change">On change (emit when detection count changes)</option>
    </select>
  </div>
  <div class="form-row" id="row-interval">
    <label for="node-input-interval"><i class="fa fa-clock-o"></i> Interval (s)</label>
    <input type="text" id="node-input-interval" placeholder="2" />
  </div>
</script>

<script type="text/html" data-help-name="conecsa-stats">
  <p>
    Subscribes to the <code>/api/v1/stats/stream</code> SSE endpoint and
    forwards performance statistics as Node-RED messages. No input is
    required — the node is autonomous.
  </p>
  <h3>Connection</h3>
  <p>
    Select a <b>Hub</b> (a <code>conecsa-hub</code> configuration) and a
    <b>Device</b> to reach the device through the hub's Developer API; the
    <b>API endpoint</b> then shows the resulting route
    (<code>https://&lt;hub&gt;:&lt;port&gt;/devices/&lt;device&gt;</code>).
    Leave the hub empty to call an api-gateway directly: the API endpoint field,
    then the <code>INFERENCE_URL</code> environment variable, then
    <code>http://api-gateway:5000</code> (the default inside a device).
  </p>
  <h3>Configuration</h3>
  <dl class="message-properties">
    <dt>mode <span class="property-type">string</span></dt>
    <dd>
      <code>interval</code> — emits the freshest snapshot once every
      <em>interval</em> seconds.<br />
      <code>on-change</code> — emits only when the detection count
      (<code>payload.detections</code>) changes; fps and inference_time
      noise is ignored.
    </dd>
    <dt>interval <span class="property-type">number</span></dt>
    <dd>Throttle period in seconds (only used in <code>interval</code> mode).</dd>
  </dl>
  <h3>Output</h3>
  <dl class="message-properties">
    <dt>payload.detections <span class="property-type">number</span></dt>
    <dd>Detections in the last frame.</dd>
    <dt>payload.fps <span class="property-type">number</span></dt>
    <dd>Current frames per second.</dd>
    <dt>payload.inference_time <span class="property-type">number</span></dt>
    <dd>Inference time in milliseconds.</dd>
    <dt>payload.frames_with_detections <span class="property-type">number</span></dt>
    <dd>Cumulative count of frames that had at least one detection.</dd>
  </dl>
</script>
