<script type="text/javascript">
  RED.nodes.registerType("conecsa-detection-models", {
    category: "Conecsa",
    color: "#1a73e8",
    defaults: {
      name: { value: "" },
      hub: { value: "", type: "conecsa-hub", required: false },
      device: { value: "" },
      inferenceUrl: { value: "" },
      action: { value: "list" },
      modelName: { value: "" },
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-cube",
    label: function () {
      return this.name || "detection models";
    },
    paletteLabel: "detection models",
    oneditprepare: function () {
      this._conecsaHub = window.conecsaHubFields ? window.conecsaHubFields(this) : null;
      function toggleModelName() {
        var action = $("#node-input-action").val();
        if (action === "select") {
          $("#row-modelName").show();
        } else {
          $("#row-modelName").hide();
        }
      }
      $("#node-input-action").on("change", toggleModelName);
      toggleModelName();
    },
    oneditsave: function () {
      if (this._conecsaHub) this._conecsaHub.save();
    },
  });
</script>

<script type="text/html" data-template-name="conecsa-detection-models">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-hub"><i class="fa fa-sitemap"></i> Hub</label>
    <input type="text" id="node-input-hub" />
  </div>
  <div class="form-row" id="conecsa-device-row">
    <label for="node-input-device"><i class="fa fa-id-card"></i> Device</label>
    <select id="node-input-device" style="width:70%"></select>
    <span id="conecsa-device-hint" style="display:block; margin-left:105px; color:#888; font-size:0.9em"></span>
  </div>
  <div class="form-row">
    <label for="node-input-inferenceUrl"><i class="fa fa-server"></i> API endpoint</label>
    <input type="text" id="node-input-inferenceUrl" placeholder="http://api-gateway:5000" />
  </div>
  <div class="form-row">
    <label for="node-input-action"><i class="fa fa-cog"></i> Action</label>
    <select id="node-input-action">
      <option value="list">List models</option>
      <option value="select">Select model</option>
    </select>
  </div>
  <div class="form-row" id="row-modelName">
    <label for="node-input-modelName"><i class="fa fa-cube"></i> Model name</label>
    <input type="text" id="node-input-modelName" placeholder="yolov8n.engine" />
  </div>
</script>

<script type="text/html" data-help-name="conecsa-detection-models">
  <p>
    Lists available detection models or selects a model to use.
  </p>
  <h3>Connection</h3>
  <p>
    Select a <b>Hub</b> (a <code>conecsa-hub</code> configuration) and a
    <b>Device</b> to reach the device through the hub's Developer API; the
    <b>API endpoint</b> then shows the resulting route
    (<code>https://&lt;hub&gt;:&lt;port&gt;/devices/&lt;device&gt;</code>).
    Leave the hub empty to call an api-gateway directly: the API endpoint field,
    then the <code>INFERENCE_URL</code> environment variable, then
    <code>http://api-gateway:5000</code> (the default inside a device).
  </p>
  <h3>Configuration</h3>
  <dl class="message-properties">
    <dt>action <span class="property-type">string</span></dt>
    <dd><code>list</code> — list all available models.<br /><code>select</code> — select a model by name.</dd>
    <dt>modelName <span class="property-type">string</span></dt>
    <dd>Model filename to select (only for <code>select</code> action).</dd>
  </dl>
  <h3>Input</h3>
  <dl class="message-properties">
    <dt class="optional">action <span class="property-type">string</span></dt>
    <dd>Override the configured action.</dd>
    <dt class="optional">modelName <span class="property-type">string</span></dt>
    <dd>Override the configured model name.</dd>
  </dl>
  <h3>Output</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>
      For <code>list</code>: <code>{ models: [{ name, size, modified, is_active }] }</code>.<br />
      For <code>select</code>: response from the inference service.
    </dd>
  </dl>
</script>
