<script type="text/javascript">
  RED.nodes.registerType("conecsa-reset-stats", {
    category: "Conecsa",
    color: "#1a73e8",
    defaults: {
      name: { value: "" },
      hub: { value: "", type: "conecsa-hub", required: false },
      device: { value: "" },
      inferenceUrl: { value: "" },
      scope: {
        value: "all",
        validate: RED.validators.regex(/^(all|counter|stats)$/),
      },
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-eraser",
    label: function () {
      return this.name || "reset stats";
    },
    oneditprepare: function () {
      this._conecsaHub = window.conecsaHubFields ? window.conecsaHubFields(this) : null;
    },
    oneditsave: function () {
      if (this._conecsaHub) this._conecsaHub.save();
    },
    paletteLabel: "reset stats",
  });
</script>

<script type="text/html" data-template-name="conecsa-reset-stats">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-hub"><i class="fa fa-sitemap"></i> Hub</label>
    <input type="text" id="node-input-hub" />
  </div>
  <div class="form-row" id="conecsa-device-row">
    <label for="node-input-device"><i class="fa fa-id-card"></i> Device</label>
    <select id="node-input-device" style="width:70%"></select>
    <span id="conecsa-device-hint" style="display:block; margin-left:105px; color:#888; font-size:0.9em"></span>
  </div>
  <div class="form-row">
    <label for="node-input-inferenceUrl"><i class="fa fa-server"></i> API endpoint</label>
    <input type="text" id="node-input-inferenceUrl" placeholder="http://api-gateway:5000" />
  </div>
  <div class="form-row">
    <label for="node-input-scope"><i class="fa fa-cog"></i> Scope</label>
    <select id="node-input-scope">
      <option value="all">All (counter + stats)</option>
      <option value="counter">Counter only</option>
      <option value="stats">Stats only</option>
    </select>
  </div>
</script>

<script type="text/html" data-help-name="conecsa-reset-stats">
  <p>
    Resets statistics and/or detection counter on the inference service.
  </p>
  <h3>Connection</h3>
  <p>
    Select a <b>Hub</b> (a <code>conecsa-hub</code> configuration) and a
    <b>Device</b> to reach the device through the hub's Developer API; the
    <b>API endpoint</b> then shows the resulting route
    (<code>https://&lt;hub&gt;:&lt;port&gt;/devices/&lt;device&gt;</code>).
    Leave the hub empty to call an api-gateway directly: the API endpoint field,
    then the <code>INFERENCE_URL</code> environment variable, then
    <code>http://api-gateway:5000</code> (the default inside a device).
  </p>
  <h3>Configuration</h3>
  <dl class="message-properties">
    <dt>scope <span class="property-type">string</span></dt>
    <dd>
      <code>all</code> — reset both counter and system stats.<br />
      <code>counter</code> — reset only the accumulated detection count.<br />
      <code>stats</code> — reset only system stats (fps, inference_time, detections, frames_with_detections).
    </dd>
  </dl>
  <h3>Input</h3>
  <dl class="message-properties">
    <dt class="optional">scope <span class="property-type">string</span></dt>
    <dd>Override the configured scope.</dd>
  </dl>
  <h3>Output</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd><code>{reset: "all|counter|stats", success: true}</code></dd>
  </dl>
</script>
