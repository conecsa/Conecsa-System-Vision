<script type="text/javascript">
  RED.nodes.registerType("conecsa-gpio", {
    category: "Conecsa",
    color: "#1a73e8",
    defaults: {
      name: { value: "" },
      hub: { value: "", type: "conecsa-hub", required: false },
      device: { value: "" },
      inferenceUrl: { value: "" },
      pin: {
        value: "29",
        required: true,
        validate: RED.validators.regex(/^(29|31|33)$/),
      },
      action: {
        value: "high",
        validate: RED.validators.regex(/^(high|low|toggle|payload)$/),
      },
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-microchip",
    label: function () {
      return this.name || "gpio pin " + this.pin;
    },
    oneditprepare: function () {
      this._conecsaHub = window.conecsaHubFields ? window.conecsaHubFields(this) : null;
    },
    oneditsave: function () {
      if (this._conecsaHub) this._conecsaHub.save();
    },
    paletteLabel: "gpio",
  });
</script>

<script type="text/html" data-template-name="conecsa-gpio">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-hub"><i class="fa fa-sitemap"></i> Hub</label>
    <input type="text" id="node-input-hub" />
  </div>
  <div class="form-row" id="conecsa-device-row">
    <label for="node-input-device"><i class="fa fa-id-card"></i> Device</label>
    <select id="node-input-device" style="width:70%"></select>
    <span id="conecsa-device-hint" style="display:block; margin-left:105px; color:#888; font-size:0.9em"></span>
  </div>
  <div class="form-row">
    <label for="node-input-inferenceUrl"><i class="fa fa-server"></i> API endpoint</label>
    <input type="text" id="node-input-inferenceUrl" placeholder="http://api-gateway:5000" />
  </div>
  <div class="form-row">
    <label for="node-input-pin"><i class="fa fa-microchip"></i> Pin</label>
    <select id="node-input-pin">
      <option value="29">Pin 29</option>
      <option value="31">Pin 31</option>
      <option value="33">Pin 33</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-action"><i class="fa fa-cog"></i> Action</label>
    <select id="node-input-action">
      <option value="high">Set HIGH</option>
      <option value="low">Set LOW</option>
      <option value="toggle">Toggle (auto)</option>
      <option value="payload">Payload</option>
    </select>
  </div>
</script>

<script type="text/html" data-help-name="conecsa-gpio">
  <p>
    Drives a single GPIO output pin HIGH or LOW on the Jetson 40-pin header
    (BOARD numbering). Controllable pins: 29, 31, 33.
  </p>
  <h3>Connection</h3>
  <p>
    Select a <b>Hub</b> (a <code>conecsa-hub</code> configuration) and a
    <b>Device</b> to reach the device through the hub's Developer API; the
    <b>API endpoint</b> then shows the resulting route
    (<code>https://&lt;hub&gt;:&lt;port&gt;/devices/&lt;device&gt;</code>).
    Leave the hub empty to call an api-gateway directly: the API endpoint field,
    then the <code>INFERENCE_URL</code> environment variable, then
    <code>http://api-gateway:5000</code> (the default inside a device).
  </p>
  <h3>Configuration</h3>
  <dl class="message-properties">
    <dt>pin <span class="property-type">number</span></dt>
    <dd>The output pin to drive.</dd>
    <dt>action <span class="property-type">string</span></dt>
    <dd>
      <code>high</code> — set the pin HIGH.<br />
      <code>low</code> — set the pin LOW.<br />
      <code>toggle</code> — flip the pin based on its current level.<br />
      <code>payload</code> — use <code>msg.payload</code>
      (<code>true</code>=HIGH, <code>false</code>=LOW).
    </dd>
  </dl>
  <h3>Input</h3>
  <dl class="message-properties">
    <dt class="optional">action <span class="property-type">string</span></dt>
    <dd>Override the configured action.</dd>
    <dt class="optional">payload <span class="property-type">boolean</span></dt>
    <dd>For <code>payload</code> mode: <code>true</code>=HIGH, <code>false</code>=LOW.</dd>
  </dl>
  <h3>Output</h3>
  <p>
    Emits <code>{ payload: { pin, level, success } }</code> after this node
    drives the pin.
  </p>
  <p>
    The node also subscribes to the event stream, so the status badge
    live-updates whenever the pin changes on any client (web app, another flow,
    curl). Such external changes emit
    <code>{ payload: { pin, level, event } }</code> on the actual transition;
    the initial state at flow start is not emitted.
  </p>
</script>
